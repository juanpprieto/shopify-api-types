version: 2
updates:
  # NPM dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 10
    assignees:
      - 'juanpprieto'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      npm:
        patterns:
          - '*'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 5
    assignees:
      - 'juanpprieto'
    groups:
      actions:
        patterns:
          - '*'
