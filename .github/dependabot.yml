version: 2
updates:
  # NPM dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 10
    assignees:
      - 'juanpprieto'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # Follows the lowest Node version in engines
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports only <6.1.0
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 5
    assignees:
      - 'juanpprieto'
    groups:
      actions:
        patterns:
          - '*'
