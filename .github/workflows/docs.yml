name: Docs

# Regenerates README.md with OpenCode Go and opens a PR for human review.
# Run it on the release branch after the version bump, before the release.

on:
  workflow_dispatch:
    inputs:
      model:
        description:
          OpenCode Go model (empty uses the default in
          scripts/lib/opencode-go.ts)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Derive RELEASE_DATE from package version
        run:
          echo "RELEASE_DATE=$(npx tsx scripts/release-date-from-version.ts)" >>
          "$GITHUB_ENV"
      # The generator reads dist/comparisons
      - run: npm run build:ci
      - name: Generate README (fails on the style gate)
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_GO_MODEL: ${{ inputs.model }}
        run: npm run docs
      - run: npx prettier --write README.md
      - name: Open a PR with the new README
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          if git diff --quiet README.md; then
            echo "README.md did not change."
            exit 0
          fi
          branch="docs/readme-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add README.md
          git commit -m "docs: regenerate README"
          git push origin "$branch"
          gh pr create --base "$BASE" --head "$branch" --title "docs: regenerate README" \
            --body "Generated by the Docs workflow. Read the text before you merge."
