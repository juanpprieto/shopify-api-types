name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: |
          npm run type-check
          npm run lint
          npm run format:check

      - name: Build package
        run: npm run build:ci

      - name: Validate build output
        run: |
          npm run ci:validate-build
          npm run ci:validate-types
          npm run ci:validate-version-model

      - name: Run tests
        run: npm test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run changeset:publish
          title: 'chore: release package'
          commit: 'chore: release package'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name:
            v${{ fromJson(steps.changesets.outputs.publishedPackages)[0].version
            }}
          release_name:
            Release v${{
            fromJson(steps.changesets.outputs.publishedPackages)[0].version }}
          body: |
            ## 🚀 What's Changed

            This release provides TypeScript definitions for Shopify's GraphQL APIs with comprehensive type safety and validation.

            ### 📦 Installation

            ```bash
            npm install @juanpprieto/shopify-api-types@${{ fromJson(steps.changesets.outputs.publishedPackages)[0].version }}
            ```

            ### 🔧 Usage

            ```typescript
            // Use the current stable API version
            import type { Product, Shop } from '@juanpprieto/shopify-api-types/admin/current'
            import type { Cart } from '@juanpprieto/shopify-api-types/sfapi/current'

            // Or specify a version explicitly
            import type { Product } from '@juanpprieto/shopify-api-types/admin/2025-07'
            ```

            ### 📊 Type Coverage

            - **Admin API**: 1,758+ types for store management, webhooks, analytics
            - **Storefront API**: 261+ types for product catalog, cart, checkout
            - **Customer Account API**: 296+ types for customer profiles, orders

            ### 📝 Changelog

            See [CHANGELOG.md](https://github.com/juanpprieto/shopify-api-types/blob/main/CHANGELOG.md) for detailed changes.

            ### 🔗 Links

            - [NPM Package](https://www.npmjs.com/package/@juanpprieto/shopify-api-types)
            - [Documentation](https://github.com/juanpprieto/shopify-api-types#readme)
            - [Shopify API Docs](https://shopify.dev/docs/api)
          draft: false
          prerelease: false

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Check for known vulnerabilities
        run: |
          if npm audit --audit-level=critical 2>/dev/null; then
            echo "No critical vulnerabilities found"
          else
            echo "Critical vulnerabilities detected - blocking release"
            npm audit --audit-level=critical
            exit 1
          fi
