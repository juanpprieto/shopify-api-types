name: Release

# Start by hand after the release commit is on main and CI is green.
# The npm trusted publisher matches this file name and the "main"
# environment; do not rename either.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish (for example 2026.10.0)
        required: true
        type: string
      dry_run:
        description: Check everything without uploading to npm
        type: boolean
        default: true

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: main
    permissions:
      contents: write # tag and GitHub release
      actions: read # CI status check
      id-token: write # OIDC publish and provenance
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_DRY_RUN: ${{ inputs.dry_run }}
      TARBALL: /tmp/juanpprieto-shopify-api-types-${{ inputs.version }}.tgz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check version, changelog, branch and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'require("node:assert/strict").equal(require("./package.json").version, process.env.RELEASE_VERSION, "Requested version must match package.json")'
          grep -q "^## $RELEASE_VERSION\$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $RELEASE_VERSION' section."; exit 1; }
          if [[ "$RELEASE_DRY_RUN" != "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publication is only allowed from main."
            exit 1
          fi
          passed=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" --jq '.workflow_runs | any(.event == "push" and .conclusion == "success")')
          test "$passed" = true || { echo "CI must pass for this exact commit first."; exit 1; }

      - run: npm ci
      - name: Derive RELEASE_DATE from package version
        run:
          echo "RELEASE_DATE=$(npx tsx scripts/release-date-from-version.ts)" >>
          "$GITHUB_ENV"
      - run: npm run build:ci
      - run: npm run ci:validate-build
      - run: npm run ci:validate-types
      - run: npm pack --ignore-scripts --pack-destination /tmp

      - name: Test the packed archive in the consumer app
        working-directory: tests/e2e/test-app
        run: |
          npm install
          npm install --no-save "$TARBALL"
          npm run typecheck
          npm test

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install --global npm@12.2.0
      - name: Publish the tested archive or dry run
        run: |
          flags=()
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then flags+=(--dry-run); fi
          npm publish "$TARBALL" --access public --provenance --ignore-scripts "${flags[@]}"

      - name: Check published integrity and provenance
        if: ${{ !inputs.dry_run }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const expected = 'sha512-' + createHash('sha512').update(readFileSync(process.env.TARBALL)).digest('base64');
          const url = `https://registry.npmjs.org/@juanpprieto%2Fshopify-api-types/${process.env.RELEASE_VERSION}`;
          // npm can take several minutes to expose a successful upload
          for (let attempt = 0; attempt < 60; attempt++) {
            const response = await fetch(url);
            if (response.ok) {
              const { dist } = await response.json();
              if (dist.integrity !== expected) throw new Error('Published archive integrity differs from the tested archive');
              if (dist.attestations?.provenance) {
                console.log(`Checked integrity and provenance for ${process.env.RELEASE_VERSION}`);
                process.exit(0);
              }
            }
            console.log(`Waiting for npm registry processing (${attempt + 1}/60). The upload already succeeded.`);
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          throw new Error('Upload completed but registry checks are pending. Inspect the published version before you retry; do not republish.');
          NODE

      - name: Create tag and GitHub release from CHANGELOG
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $RELEASE_VERSION" '$0 == v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > /tmp/notes.md
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --notes-file /tmp/notes.md
