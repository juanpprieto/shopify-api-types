name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run deadcode
      - name: No emojis in tracked files
        run: |
          # shellcheck disable=SC2016 # Perl code, not shell
          git ls-files -z | xargs -0 perl -CSD -ne 'if (/\p{Extended_Pictographic}|[\x{2713}\x{2717}\x{FE0F}\x{20E3}]/) { print "$ARGV:$.: $_"; $bad = 1 } close ARGV if eof; END { exit($bad ? 1 : 0) }'

  test:
    name: Test (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Coverage
        if: matrix.node == '26' && matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

  # Build, validate, then install the packed tarball into a consumer app
  build:
    name: Build and E2E (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Derive RELEASE_DATE from package version
        run:
          echo "RELEASE_DATE=$(npx tsx scripts/release-date-from-version.ts)" >>
          "$GITHUB_ENV"
      # postbuild also generates and validates the schema comparisons
      - run: npm run build:ci
      - run: npm run ci:validate-build
      - run: npm run ci:validate-types
      - run: npm pack
      - name: E2E consumer test
        working-directory: tests/e2e/test-app
        run: |
          npm install
          npm install --no-save ../../../juanpprieto-shopify-api-types-*.tgz
          npm run typecheck
          npm test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Check for committed tokens
        run: |
          if grep -r -E "(SHOPIFY.*ACCESS.*TOKEN|OPENCODE_GO_API_KEY).*=.*['\"]?[A-Za-z0-9+/_-]{20,}" . --exclude-dir=node_modules --exclude=".env*" --exclude="*.md"; then
            echo "Potential secret detected"
            exit 1
          fi
