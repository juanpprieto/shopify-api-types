name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check for unused exports
        run: npm run deadcode

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Validate CalVer format
        run: |
          version=$(node -p "require('./package.json').version")
          npm run version validate "$version"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run test coverage
        run: npm run test:coverage

  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate build output
        run: npm run validate-build

      - name: Validate generated types
        run: npm run validate-types

      - name: Check package integrity
        run: npm pack --dry-run

  changeset-validation:
    name: Changeset Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for changesets
        run: |
          if [ -n "$(ls .changeset/*.md 2>/dev/null | grep -v README.md | grep -v example-)" ]; then
            echo "✅ Changeset found"
          else
            echo "❌ No changeset found. Please run 'npm run changeset' to describe your changes."
            exit 1
          fi

      - name: Validate changeset format
        run: |
          # Preview what the release would look like
          npm run release:dry

  schema-analysis:
    name: Schema Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Analyze schema types
        run: npm run count-types

      - name: Generate documentation
        run: npm run docs

      - name: Verify documentation is up to date
        run: |
          if [ -n "$(git diff --exit-code README.md)" ]; then
            echo "❌ README.md is not up to date. Run 'npm run docs' and commit the changes."
            git diff README.md
            exit 1
          else
            echo "✅ Documentation is up to date"
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level high

      - name: Check for sensitive files
        run: |
          # Check for accidentally committed sensitive files
          if grep -r "SHOPIFY.*ACCESS.*TOKEN" . --exclude-dir=node_modules --exclude=".env.example" --exclude="*.md"; then
            echo "❌ Potential sensitive information detected"
            exit 1
          else
            echo "✅ No sensitive information detected"
          fi

  matrix-test:
    name: Node.js Matrix Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        lint-and-format,
        type-check,
        test,
        build-and-validate,
        schema-analysis,
        security,
        matrix-test,
      ]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint-and-format.result }}" == "success" && \
                "${{ needs.type-check.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.build-and-validate.result }}" == "success" && \
                "${{ needs.schema-analysis.result }}" == "success" && \
                "${{ needs.security.result }}" == "success" && \
                "${{ needs.matrix-test.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi
