name: Update Badges

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-badges:
    name: Update README Badges
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update badges in docs template
        run: |
          # Update the documentation template to include badges
          sed -i '1s/^/# Shopify API Types\n\n[![CI](https:\/\/github.com\/juanpprieto\/shopify-api-types\/workflows\/CI\/badge.svg)](https:\/\/github.com\/juanpprieto\/shopify-api-types\/actions\/workflows\/ci.yml)\n[![Release](https:\/\/github.com\/juanpprieto\/shopify-api-types\/workflows\/Release\/badge.svg)](https:\/\/github.com\/juanpprieto\/shopify-api-types\/actions\/workflows\/release.yml)\n[![npm version](https:\/\/badge.fury.io\/js\/@juanpprieto\/shopify-api-types.svg)](https:\/\/www.npmjs.com\/package\/@juanpprieto\/shopify-api-types)\n[![License: MIT](https:\/\/img.shields.io\/badge\/License-MIT-yellow.svg)](https:\/\/opensource.org\/licenses\/MIT)\n\n/' scripts/generate-docs.ts || echo "Badge update skipped"

      - name: Regenerate documentation
        run: npm run docs

      - name: Commit updated README
        run: |
          if [ -n "$(git diff --exit-code README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update badges and documentation"
            git push
          else
            echo "No badge updates needed"
          fi
