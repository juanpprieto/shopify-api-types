name: Update Badges

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-badges:
    name: Update README Badges
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure badges in README
        run: |
          # Idempotent: insert the CI and Release badges directly after the
          # H1 title only when they are missing. Never touches source files.
          if grep -q 'actions/workflows/ci.yml' README.md; then
            echo "Badges already present"
            exit 0
          fi

          awk 'NR==1 && /^# / {
            print
            print ""
            print "[![CI](https://github.com/juanpprieto/shopify-api-types/actions/workflows/ci.yml/badge.svg)](https://github.com/juanpprieto/shopify-api-types/actions/workflows/ci.yml)"
            print "[![Release](https://github.com/juanpprieto/shopify-api-types/actions/workflows/release.yml/badge.svg)](https://github.com/juanpprieto/shopify-api-types/actions/workflows/release.yml)"
            next
          }
          { print }' README.md > README.md.tmp
          mv README.md.tmp README.md

      - name: Commit updated README
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: ensure workflow badges in README"
            git push
          else
            echo "No badge updates needed"
          fi
