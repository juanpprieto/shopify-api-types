name: E2E Tests

on:
  pull_request:
    branches: [main, phase-1]
  push:
    branches: [main, phase-1]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Build package
        run: npm run build:ci

      - name: Pack package
        run: npm pack

      - name: Run E2E tests
        run: |
          cd tests/e2e/test-app
          npm install
          npm install ../../../juanpprieto-shopify-api-types-*.tgz
          npm run typecheck
          npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-node-${{ matrix.node-version }}
          path: tests/e2e/test-app/test-results/
          retention-days: 7
