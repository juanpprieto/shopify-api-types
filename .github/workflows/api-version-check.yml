name: API Version Check

# Opens one issue when Shopify has a stable API version that the package
# does not ship yet. The release itself follows the CONTRIBUTING.md
# quarterly release guide.

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Compare the packaged version with Shopify's current version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The package version maps to an API version (2026.7.0 -> 2026-07)
          # through the same version model the build uses
          current_of() {
            RELEASE_DATE="$1" npx tsx -e "
              import { getCurrentVersionSet } from './scripts/version-utils.ts';
              console.log(getCurrentVersionSet().current);
            "
          }
          packaged=$(current_of "$(npx tsx scripts/release-date-from-version.ts)")
          latest=$(current_of "")
          echo "Packaged: $packaged. Shopify current: $latest."

          if [[ ! "$latest" > "$packaged" ]]; then
            echo "The package ships the current version."
            exit 0
          fi

          title="Release support for Shopify API $latest"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq length)
          if [[ "$open" != "0" ]]; then
            echo "An open issue already tracks $latest."
            exit 0
          fi

          gh issue create --title "$title" --body "Shopify API \`$latest\` is the current stable version. The package ships \`$packaged\`.

          Follow the quarterly release guide in CONTRIBUTING.md."
